[project]
name = "jeanlucrecord"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "numpy>=1.24.0",
    "onnx>=1.22.0",
    "onnxruntime-gpu>=1.28.0",
    "openai-whisper>=20250625",
    "pillow>=12.3.0",
    "piper-phonemize-fix>=1.2.2",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    # chatterbox-tts's resemble-perth dep imports pkg_resources, removed in setuptools>=81
    "setuptools<81",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
]
